server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 13m;
 error_page 413 = @too_large;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 60s; }
 location /docs { proxy_pass http://backend:8000; }
 location /openapi.json { proxy_pass http://backend:8000; }
 location @too_large {
   default_type application/json;
   add_header X-Request-ID $request_id always;
   add_header Cache-Control no-store always;
   add_header X-Content-Type-Options nosniff always;
   return 413 '{"error":"FILE_TOO_LARGE","request_id":"$request_id"}';
 }
 location / { try_files $uri $uri/ /index.html; }
}
