services:
  - type: web
    name: visiongate
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SAMSUNG_ENABLED
        value: "true"
      - key: SAMSUNG_OCR_ENGINE
        value: ppocrv5
      - key: SAMSUNG_OCR_MEMORY_PROFILE
        value: bounded
      - key: SAMSUNG_OCR_DETECTOR
        value: mobile
      - key: SAMSUNG_RECOGNITION_PROFILE
        value: enhanced
      - key: SAMSUNG_POLICY_PROFILE
        value: role-v1
      - key: STORE_ANALYSIS_IMAGES
        value: "false"
      - key: HISTORY_DB
        value: /app/data/history.sqlite3
      - key: GATE_CONFIG
        value: /app/data/thresholds.json
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
